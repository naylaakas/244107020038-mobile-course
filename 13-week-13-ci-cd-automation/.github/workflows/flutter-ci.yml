name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 13-week-13-ci-cd-automation/campus_notify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Gradle Maven Mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2"
          allprojects {
              buildscript {
                  repositories {
                      all { ArtifactRepository repo ->
                          if (repo instanceof MavenArtifactRepository) {
                              def u = repo.url.toString()
                              if (u.startsWith("https://repo.maven.apache.org/maven2") || u.startsWith("https://repo1.maven.org/maven2")) {
                                  repo.setUrl(mirrorUrl)
                              }
                          }
                      }
                  }
              }
              repositories {
                  all { ArtifactRepository repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          def u = repo.url.toString()
                          if (u.startsWith("https://repo.maven.apache.org/maven2") || u.startsWith("https://repo1.maven.org/maven2")) {
                              repo.setUrl(mirrorUrl)
                          }
                      }
                  }
              }
          }
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  maven { url = uri(mirrorUrl) }
                  all { ArtifactRepository repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          def u = repo.url.toString()
                          if (u.startsWith("https://repo.maven.apache.org/maven2") || u.startsWith("https://repo1.maven.org/maven2")) {
                              repo.setUrl(mirrorUrl)
                          }
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Project (Linter)
        run: flutter analyze --fatal-infos

      - name: Run Tests with Coverage
        run: flutter test --coverage

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build App Bundle (Release)
        run: flutter build appbundle --release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            13-week-13-ci-cd-automation/campus_notify/build/app/outputs/flutter-apk/app-release.apk
            13-week-13-ci-cd-automation/campus_notify/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
